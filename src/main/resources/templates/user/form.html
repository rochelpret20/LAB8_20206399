<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="base :: head('Mi perfil')"></head><body><nav th:replace="base :: navbar"></nav><main class="container py-4"><div th:replace="base :: message"></div><h1>Mi perfil</h1><p>La cuenta y el rol no se modifican desde este formulario.</p><form th:action="@{/user/guardar}" th:object="${profileForm}" method="post"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">Revisa los campos y sus longitudes.</div>
<div class="form-group"><label for="firstname">Nombre</label><input class="form-control" th:field="*{firstname}" maxlength="50" required></div><div class="form-group"><label for="lastname">Apellido</label><input class="form-control" th:field="*{lastname}" maxlength="50" required></div><div class="form-group"><label for="intro">Presentación</label><textarea class="form-control" th:field="*{intro}" maxlength="255"></textarea></div><div class="form-group"><label for="profile">Perfil</label><textarea class="form-control" th:field="*{profile}" maxlength="2000" rows="5"></textarea></div><button class="btn btn-primary">Guardar perfil</button></form></main></body></html>
