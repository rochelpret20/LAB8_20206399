<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="base :: head('Usuarios')"></head><body><nav th:replace="base :: navbar"></nav><main class="container py-4"><div th:replace="base :: message"></div><h1>Usuarios</h1><div class="table-responsive"><table class="table"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr></thead><tbody><tr th:each="u : ${listausuarios}"><td th:text="${u.firstname + ' ' + u.lastname}"></td><td th:text="${u.email}"></td><td th:text="${u.id_role.role_name}"></td><td th:text="${u.active ? 'Activo' : 'Inactivo'}"></td></tr></tbody></table></div></main></body></html>
