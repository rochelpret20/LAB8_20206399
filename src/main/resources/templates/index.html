<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="base :: head('Iniciar sesión')"></head><body><main class="container py-5 login"><h1>Blog Telecom</h1><p>Ingresa para leer y compartir publicaciones.</p>
<p class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos, o cuenta inactiva.</p><p class="alert alert-info" th:if="${param.logout}">Sesión cerrada.</p>
<form th:action="@{/processlogin}" method="post"><div class="form-group"><label for="username">Correo</label><input id="username" name="username" type="email" class="form-control" autocomplete="username" required></div><div class="form-group"><label for="password">Contraseña</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div><button class="btn btn-primary">Iniciar sesión</button></form></main></body></html>
