<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="base :: head('Amistades')"></head><body><nav th:replace="base :: navbar"></nav><main class="container py-4"><div th:replace="base :: message"></div><h1>Amistades</h1><h2 class="h4">Buscar personas</h2><p>Solo el destinatario puede aceptar o rechazar una solicitud. Una solicitud rechazada se elimina y se puede volver a enviar.</p>
<div class="table-responsive"><table class="table"><thead><tr><th>Persona</th><th>Acción</th></tr></thead><tbody><tr th:each="u : ${people}"><td th:text="${u.firstname + ' ' + u.lastname}"></td><td><form th:action="@{/friends/send}" method="post"><input type="hidden" name="recipientId" th:value="${u.id_user}"><button class="btn btn-outline-primary btn-sm" th:disabled="${connected.contains(u.id_user)}" th:text="${connected.contains(u.id_user) ? 'Solicitud enviada o amistad existente' : 'Enviar solicitud'}">Enviar solicitud</button></form></td></tr></tbody></table></div>
<h2 class="h4">Mis solicitudes y amistades</h2><p th:if="${#lists.isEmpty(requests)}">Todavía no hay solicitudes.</p><div class="card mb-2" th:each="r : ${requests}"><div class="card-body"><p><span th:text="${r.sender.firstname + ' ' + r.sender.lastname}"></span> → <span th:text="${r.recipient.firstname + ' ' + r.recipient.lastname}"></span> · <strong th:text="${r.status == 'ACCEPTED' ? 'Amigos' : 'Pendiente'}"></strong></p>
<div th:if="${r.status == 'PENDING' and r.recipient.id_user == viewer.id_user}"><form class="d-inline" th:action="@{/friends/{id}/accept(id=${r.id})}" method="post"><button class="btn btn-success btn-sm">Aceptar</button></form> <form class="d-inline" th:action="@{/friends/{id}/reject(id=${r.id})}" method="post"><button class="btn btn-outline-danger btn-sm">Rechazar</button></form></div></div></div></main></body></html>
