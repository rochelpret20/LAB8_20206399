<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="base :: head('Posts')"></head><body><nav th:replace="base :: navbar"></nav><main class="container py-4"><div th:replace="base :: message"></div><div class="d-flex justify-content-between"><h1>Publicaciones</h1><a class="btn btn-primary align-self-start" th:href="@{/post/create}">Crear post</a></div>
<p>Se muestran las publicaciones y tus borradores. El administrador puede ver todos los borradores.</p><p th:if="${#lists.isEmpty(lista)}">Todavía no hay posts para mostrar.</p>
<article class="card mb-3" th:each="p : ${lista}"><div class="card-body"><h2 class="h4" th:text="${p.title}"></h2><p class="text-muted"><span th:text="${p.user.firstname + ' ' + p.user.lastname}"></span> · <span th:text="${p.published ? 'Publicado' : 'Borrador'}"></span></p><p class="font-weight-bold" th:text="${p.summary}"></p><p class="post-content" th:text="${p.content}"></p>
<a th:if="${isAdmin or p.user.id_user == viewer.id_user}" class="btn btn-outline-primary btn-sm" th:href="@{/post/edit(id=${p.id_Post})}">Editar</a>
<form th:if="${isAdmin}" class="d-inline" th:action="@{/post/borrar}" method="post" onsubmit="return confirm('¿Eliminar este post?')"><input type="hidden" name="id" th:value="${p.id_Post}"><button class="btn btn-outline-danger btn-sm">Eliminar</button></form></div></article></main></body></html>
