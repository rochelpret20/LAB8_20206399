<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="base :: head('Editar publicación')"></head><body><nav th:replace="base :: navbar"></nav><main class="container py-4"><div th:replace="base :: message"></div><h1 th:text="${postForm.id == 0 ? 'Crear post' : 'Editar post'}"></h1>
<form th:action="@{/post/guardar}" th:object="${postForm}" method="post"><input type="hidden" th:field="*{id}"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<div class="form-group"><label for="title">Título</label><input class="form-control" th:field="*{title}" maxlength="75" required></div><div class="form-group"><label for="summary">Resumen</label><textarea class="form-control" th:field="*{summary}" maxlength="255" rows="2"></textarea></div><div class="form-group"><label for="content">Contenido</label><textarea class="form-control" th:field="*{content}" maxlength="10000" rows="8" required></textarea></div><div class="form-check mb-3"><input type="checkbox" class="form-check-input" th:field="*{published}"><label class="form-check-label" for="published1">Publicado</label></div><button class="btn btn-primary">Guardar</button> <a class="btn btn-secondary" th:href="@{/post}">Cancelar</a></form></main></body></html>
