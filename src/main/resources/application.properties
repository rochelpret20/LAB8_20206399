spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Lab5?serverTimezone=America/Lima&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:lab5}
spring.datasource.password=${DB_PASSWORD:lab5_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
