services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: Lab5
      MYSQL_USER: lab5
      MYSQL_PASSWORD: ${DB_PASSWORD:-lab5_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D Lab5 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/Lab5?serverTimezone=America/Lima&characterEncoding=UTF-8
      DB_USER: lab5
      DB_PASSWORD: ${DB_PASSWORD:-lab5_local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
